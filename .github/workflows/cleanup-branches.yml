name: Cleanup Screeps Branches

on:
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Activate default and delete all other branches
        run: node scripts/cleanup-branches.mjs
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          KEEP_BRANCH: default
